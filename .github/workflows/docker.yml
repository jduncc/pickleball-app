name: Build and publish image
on:
  push:
    branches: [main]
permissions:
  contents: write
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    # Guards against the version-bump commit below re-triggering this
    # workflow forever: GitHub skips a push whose commit message contains
    # [skip ci].
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    steps:
      - uses: actions/checkout@v4

      - name: Bump micro version
        id: bump
        run: |
          cd server
          npm version patch --no-git-tag-version
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add server/package.json
          git commit -m "ci: bump version to v${{ steps.bump.outputs.version }} [skip ci]"
          git push

      - name: Set build date
        id: build_date
        run: echo "value=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:v${{ steps.bump.outputs.version }}
          build-args: |
            BUILD_DATE=${{ steps.build_date.outputs.value }}
